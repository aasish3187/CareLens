      <text x="15" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#cbd5e1">• Every claim tagged [fact_id]</text>
      <text x="15" y="62" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#cbd5e1">• Visual Bounding Box Links</text>
      <text x="15" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#cbd5e1">• Strict 0% Hallucination Policy</text>
