      <text x="15" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#cbd5e1">• Code computes Normal/Elevated</text>
      <text x="15" y="62" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#cbd5e1">• NEVER trusts LLM for ranges</text>
      <text x="15" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#cbd5e1">• ICMR / WHO / ADA standard</text>
      <text x="15" y="94" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#34d399">100% Mathematical Safety</text>
