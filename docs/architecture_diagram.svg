<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <linearGradient id="tier1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <linearGradient id="tier2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <linearGradient id="tier3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>

    <linearGradient id="tier4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#701a75" />
      <stop offset="100%" stop-color="#86198f" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>

    <!-- Filters -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="800" fill="url(#bgGrad)" />

  <!-- Header Section -->
  <g id="header">
    <rect x="40" y="24" width="1120" height="70" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)" />
    <text x="70" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">
      🏥 CareLens System Architecture &amp; Data Pipeline
    </text>
    <text x="70" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
      Altrix Labs AI-Powered Personal Health Copilot · Multimodal VLM + Deterministic Rules + ABDM FHIR R4
    </text>
    <rect x="980" y="42" width="150" height="32" rx="16" fill="#065f46" stroke="#10b981" stroke-width="1" />
    <text x="1055" y="63" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#34d399" text-anchor="middle">
      ✓ F1 = 100% Verified
    </text>
  </g>

  <!-- Tier 1: Ingestion & PII Redaction -->
  <g id="tier1" transform="translate(40, 115)">
    <rect width="260" height="645" rx="14" fill="url(#tier1Grad)" stroke="#4338ca" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect x="15" y="15" width="230" height="36" rx="8" fill="#3730a3" />
    <text x="130" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#e0e7ff" text-anchor="middle">
