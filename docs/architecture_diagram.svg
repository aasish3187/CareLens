    </text>

    <!-- Cards inside Tier 1 -->
    <g transform="translate(15, 65)">
      <rect width="230" height="95" rx="8" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1" />
      <text x="15" y="25" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#a5b4fc">📄 Multi-Source Upload</text>
      <text x="15" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#cbd5e1">• Indian Lab PDFs (Apollo, SRL)</text>
      <text x="15" y="62" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#cbd5e1">• Mobile Camera Doctor Rx</text>
      <text x="15" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#cbd5e1">• Hospital Discharge Summaries</text>
    </g>

    <g transform="translate(15, 175)">
