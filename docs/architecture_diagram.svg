      <text x="15" y="25" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#6ee7b7">🇮🇳 ABDM FHIR R4 Engine</text>
      <text x="15" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#cbd5e1">• NRCeS India Profiles</text>
      <text x="15" y="62" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#cbd5e1">• LOINC + SNOMED + ICD-10</text>
      <text x="15" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#cbd5e1">• Mock ABHA 1-Click Export</text>
      <text x="15" y="94" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#34d399">Govt Health Stack Ready</text>
    </g>

    <g transform="translate(15, 305)">
