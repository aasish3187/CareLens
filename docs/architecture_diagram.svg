  <g id="tier4" transform="translate(895, 115)">
    <rect width="265" height="645" rx="14" fill="url(#tier4Grad)" stroke="#c026d3" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect x="15" y="15" width="235" height="36" rx="8" fill="#a21caf" />
    <text x="132" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#fae8ff" text-anchor="middle">
