      <text x="15" y="25" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#a5b4fc">📐 Pre-processing</text>
      <text x="15" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#cbd5e1">• Auto-deskew &amp; Perspective Warp</text>
      <text x="15" y="62" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#cbd5e1">• CLAHE Contrast Enhancement</text>
      <text x="15" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#cbd5e1">• 300 DPI Resolution Normalizer</text>
    </g>

    <g transform="translate(15, 285)">
