    <g transform="translate(15, 65)">
      <rect width="235" height="105" rx="8" fill="#4a044e" stroke="#f0abfc" stroke-width="1" />
      <text x="15" y="25" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f5d0fe">🧍 3D Body Scan (Light Mode)</text>
      <text x="15" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#cbd5e1">• Interactive Organ Pins</text>
      <text x="15" y="62" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#cbd5e1">• Green/Amber/Red Status</text>
      <text x="15" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#cbd5e1">• Organ Aggregation API</text>
      <text x="15" y="94" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#f0abfc">Signature Visual WOW</text>
    </g>

    <g transform="translate(15, 185)">
      <rect width="235" height="105" rx="8" fill="#4a044e" stroke="#f0abfc" stroke-width="1" />
      <text x="15" y="25" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f5d0fe">📑 Split Verification Studio</text>
      <text x="15" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#cbd5e1">• Left: Original Document Scan</text>
      <text x="15" y="62" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#cbd5e1">• Right: AI Summary + Badges</text>
      <text x="15" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#cbd5e1">• Click badge → Zoom highlight</text>
      <text x="15" y="94" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#f0abfc">Physician Grade Auditability</text>
    </g>

    <g transform="translate(15, 305)">
