      <text x="15" y="25" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#7dd3fc">🎛️ Layman vs Clinical Mode</text>
      <text x="15" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#cbd5e1">• Dot-Slider Range Indicators</text>
      <text x="15" y="62" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#cbd5e1">• 6th-Grade Patient Summaries</text>
      <text x="15" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#cbd5e1">• LOINC / ICD-10 Doctor View</text>
      <text x="15" y="96" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#38bdf8">Empowered Patients &amp; Doctors</text>
    </g>
  </g>

  <!-- Connective Data Flow Arrows -->
  <g id="arrows" stroke="#94a3b8" stroke-width="2" fill="none">
    <!-- Tier 1 to Tier 2 -->
    <path d="M 300 230 L 325 230" marker-end="url(#arrow)" stroke="#818cf8" stroke-dasharray="4 2" />
    <path d="M 300 340 L 325 340" marker-end="url(#arrow)" stroke="#818cf8" stroke-dasharray="4 2" />
    <!-- Tier 2 to Tier 3 -->
    <path d="M 585 230 L 610 230" marker-end="url(#arrow)" stroke="#38bdf8" stroke-dasharray="4 2" />
    <path d="M 585 360 L 610 360" marker-end="url(#arrow)" stroke="#38bdf8" stroke-dasharray="4 2" />
    <!-- Tier 3 to Tier 4 -->
    <path d="M 870 230 L 895 230" marker-end="url(#arrow)" stroke="#34d399" stroke-dasharray="4 2" />
    <path d="M 870 360 L 895 360" marker-end="url(#arrow)" stroke="#34d399" stroke-dasharray="4 2" />
