    </text>

    <g transform="translate(15, 65)">
      <rect width="230" height="105" rx="8" fill="#082f49" stroke="#38bdf8" stroke-width="1" />
      <text x="15" y="25" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#7dd3fc">🧠 Dual Multimodal Pipeline</text>
      <text x="15" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#cbd5e1">• Gemini / MedGemma VLM</text>
      <text x="15" y="62" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#cbd5e1">• PaddleOCR Bounding Boxes</text>
      <text x="15" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#cbd5e1">• Dual-Pass Consensus Merge</text>
      <text x="15" y="94" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#38bdf8">Target Extraction F1 &gt; 95%</text>
