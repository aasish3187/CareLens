name: Production Keep-Alive Ping

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping CareLens Service
        run: |
          echo "Pinging CareLens Production..."
          curl -s -f -m 30 "https://carelens-production.up.railway.app/api/health" || echo "Ping completed"

